<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{{subject}}</title>
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/IBMPlexSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/IBMPlexSans-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/IBMPlexSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: "IBM Plex Sans";
      src: url("./fonts/IBMPlexSans-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }

    @page {
      size: A4;
      margin: 21mm 20mm 23mm 24mm;
      @bottom-left {
        content: "{{sender_name}} · {{sender_contact}}";
        font: 8.5pt "IBM Plex Sans", Arial, sans-serif;
        color: #666;
      }
      @bottom-right {
        content: "Seite " counter(page) " von " counter(pages);
        font: 8.5pt "IBM Plex Sans", Arial, sans-serif;
        color: #666;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 10.8pt;
      line-height: 1.46;
      color: #111;
      background: #fff;
    }

    .page-accent {
      position: fixed;
      top: -21mm;
      right: -20mm;
      width: 73mm;
      height: 297mm;
      z-index: -1;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr 58mm;
      gap: 14mm;
      align-items: start;
      margin-bottom: 12mm;
      padding-bottom: 8mm;
      border-bottom: 0.35mm solid #111;
      break-inside: avoid;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 5mm;
    }

    .mark-symbol {
      width: 18mm;
      height: 18mm;
      flex: 0 0 auto;
    }

    .sender-name {
      font-size: 17pt;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0;
    }

    .sender-line {
      margin-top: 1.8mm;
      font-size: 9.3pt;
      color: #444;
    }

    .meta {
      font-size: 9.4pt;
      line-height: 1.35;
      color: #333;
      text-align: right;
    }

    .fax-label {
      display: inline-block;
      margin: 0 0 7mm;
      padding: 1.8mm 4mm 2mm;
      border: 0.35mm solid #111;
      font-size: 15pt;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      break-after: avoid;
    }

    .routing {
      display: grid;
      grid-template-columns: 26mm 1fr 21mm 1fr;
      gap: 2.2mm 6mm;
      margin-bottom: 10mm;
      padding: 5mm 0;
      border-top: 0.2mm solid #999;
      border-bottom: 0.2mm solid #999;
      break-inside: avoid;
    }

    .routing .label {
      font-size: 8.5pt;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
    }

    .routing .value {
      min-height: 4.6mm;
    }

    .subject {
      margin: 0 0 8mm;
      font-size: 12pt;
      line-height: 1.35;
      font-weight: 700;
      break-after: avoid;
    }

    .content p {
      margin: 0 0 4.7mm;
    }

    .content h2 {
      margin: 7mm 0 3mm;
      font-size: 12pt;
      line-height: 1.3;
      font-weight: 700;
      break-after: avoid;
    }

    .content ul,
    .content ol {
      margin: 0 0 4.7mm 5mm;
      padding: 0;
    }

    .content li {
      margin: 0 0 1.5mm;
    }

    .signature {
      margin-top: 12mm;
      break-inside: avoid;
    }

    .signature-space {
      width: 58mm;
      margin-top: 17mm;
      padding-top: 2mm;
      border-top: 0.25mm solid #111;
      font-size: 9.5pt;
      color: #333;
    }
  </style>
</head>
<body>
  <svg class="page-accent" viewBox="0 0 220 900" aria-hidden="true">
    <rect x="165" y="0" width="55" height="900" fill="#f2f2f2"/>
    <path d="M186 30 L216 30 L216 210 L112 210 L112 180 L186 180 Z" fill="#dedede"/>
    <path d="M140 270 H216 V300 H169 V365 H216 V395 H140 Z" fill="#ececec"/>
    <path d="M186 465 H216 V645 H112 V615 H186 Z" fill="#dedede"/>
    <path d="M142 710 H216 V740 H172 V810 H216 V840 H142 Z" fill="#ececec"/>
    <line x1="164" y1="0" x2="164" y2="900" stroke="#111" stroke-width="1.4"/>
  </svg>

  <header class="topbar">
    <div class="mark">
      <svg class="mark-symbol" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="7" y="7" width="50" height="50" fill="none" stroke="#111" stroke-width="3"/>
        <path d="M18 43 L32 16 L46 43 Z" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
        <path d="M25 43 H39" stroke="#111" stroke-width="3"/>
      </svg>
      <div>
        <div class="sender-name">{{sender_name}}</div>
        <div class="sender-line">{{sender_address}}</div>
      </div>
    </div>

    <div class="meta">
      {{{sender_contact_html}}}
    </div>
  </header>

  <main>
    <div class="fax-label">{{type}}</div>

    <section class="routing">
      <div class="label">An</div>
      <div class="value">{{{recipient_html}}}</div>
      <div class="label">Fax</div>
      <div class="value">{{fax}}</div>
      <div class="label">Von</div>
      <div class="value">{{sender_name}}</div>
      <div class="label">Datum</div>
      <div class="value">{{date_de}}</div>
    </section>

    <p class="subject">Betreff: {{subject_display}}</p>

    <section class="content">
      {{{body}}}
    </section>

    <section class="signature">
      <p>Mit freundlichen Gruessen</p>
      <div class="signature-space">{{sender_name}}</div>
    </section>
  </main>
</body>
</html>
